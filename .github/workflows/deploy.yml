# Portão de testes + base de conhecimento + publicação no Hugging Face Spaces.
#
#   testes ──► avaliar ──► publicar
#
# - Em QUALQUER branch e em pull requests: "testes" (T1–T24, sem rede).
# - Na main (push) ou pelo botão "Run workflow": "avaliar" reconstrói a coleção
#   "teste" no Supabase e mede a busca (T25). Fora da main, para por aí.
# - Só na main: "publicar" promove "teste" → "producao" e envia o app ao Space.
# Se algo falhar, nada é publicado: a "producao" e o site antigo continuam no ar.
# O que corrigir aparece na execução → aba "Summary".

name: Testar e publicar

on:
  push:
  pull_request:
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: read

jobs:
  testes:
    name: testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # histórico completo, para procurar chaves em commits antigos

      - name: Instalar Python 3.12 (mesma versão do Space)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar bibliotecas
        run: pip install -r requirements-dev.txt

      # "!cancelled()" faz as verificações seguintes rodarem mesmo se uma
      # anterior falhar, para você ver TODOS os problemas de uma vez.
      - name: "T1–T7 e T18: conferir o config.yaml"
        run: python scripts/validar_config.py

      - name: "T19: conferir a pasta documentos/"
        if: ${{ !cancelled() }}
        run: python scripts/validar_documentos.py

      - name: "T21: conferir as perguntas de teste"
        if: ${{ !cancelled() }}
        run: python scripts/validar_perguntas.py

      - name: "T8: procurar chaves de API no código"
        if: ${{ !cancelled() }}
        run: python scripts/procurar_chaves.py

      - name: "T8: procurar chaves no histórico do Git"
        if: ${{ !cancelled() }}
        run: python scripts/procurar_chaves.py --historico

      - name: "T17: estilo do código (ruff)"
        if: ${{ !cancelled() }}
        run: ruff check . --output-format=github

      - name: "T1–T24: testes automáticos"
        if: ${{ !cancelled() }}
        run: python -m pytest -q

  # Botão "Run workflow" fora da main: só CONFERE a configuração do
  # Hugging Face (Space, token, hardware, secrets). Não publica nada.
  conferir:
    name: conferir configuração
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas da conferência
        run: pip install "huggingface_hub==1.33.0" "PyYAML==6.0.2"

      - name: Conferir Space, token, hardware e secrets (IA e Supabase)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: python scripts/publicar.py --conferir

  # Parte 2: reconstrói a coleção "teste" no Supabase e mede a busca (T25).
  # Na main a cada push (mesmo sem documento alterado) e pelo botão "Run workflow"
  # em qualquer branch. Nunca toca na "producao".
  avaliar:
    name: avaliar
    needs: testes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Um índice por vez: duas execuções juntas misturariam a coleção "teste".
    concurrency:
      group: indice-supabase
      cancel-in-progress: false
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      # O modelo tem ~1,1 GB: guardado entre execuções para não baixar toda vez.
      - name: Reaproveitar o modelo de embedding
        id: modelo
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/modelos
          key: modelos-e5-base-${{ hashFiles('requirements.txt') }}

      - name: Indexar a coleção teste
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FASTEMBED_CACHE_PATH: ${{ runner.temp }}/modelos
        run: python scripts/indexar.py

      - name: "T25: perguntas de teste na coleção teste"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FASTEMBED_CACHE_PATH: ${{ runner.temp }}/modelos
        run: python scripts/avaliar.py

      # Guarda o modelo mesmo quando a avaliação reprova (senão baixaria de novo).
      - name: Guardar o modelo para a próxima execução
        if: ${{ always() && steps.modelo.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/modelos
          key: modelos-e5-base-${{ hashFiles('requirements.txt') }}

  publicar:
    name: publicar
    needs: [testes, avaliar]
    # Só publica a partir da main (push ou botão manual), nunca em pull requests,
    # e só se a busca passou no T25.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Mesmo grupo do "avaliar": uma publicação por vez, sem misturar coleções.
    concurrency:
      group: indice-supabase
      cancel-in-progress: false
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Só o necessário: conferir, promover e enviar não precisam do modelo de embedding.
      - name: Instalar bibliotecas da publicação
        run: pip install "huggingface_hub==1.33.0" "PyYAML==6.0.2" "httpx==0.28.1"

      - name: Conferir Space, token, hardware e secrets (IA e Supabase)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: python scripts/publicar.py --conferir

      # Primeiro promove, depois envia o código: a tabela tem o mesmo formato,
      # então a "producao" nova serve também para o app que já está no ar.
      - name: "Promover: a coleção teste vira producao (uma transação)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/indexar.py --promover

      - name: Enviar para o Space e acompanhar o build
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Opcional: crie a variável HF_SPACE no GitHub para usar outro Space.
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: python scripts/publicar.py
