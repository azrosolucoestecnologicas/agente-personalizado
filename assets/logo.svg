<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 588 380" width="588" height="380" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="15%" r="90%">
      <stop offset="0" stop-color="#27488f"/>
      <stop offset="0.5" stop-color="#132a5c"/>
      <stop offset="1" stop-color="#081430"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7f9"/>
      <stop offset="0.30" stop-color="#cfd4da"/>
      <stop offset="0.52" stop-color="#868d96"/>
      <stop offset="0.70" stop-color="#d9dde2"/>
      <stop offset="1" stop-color="#5f656e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="588" height="380" fill="url(#bg)"/>
  <g filter="url(#blur)" fill="#9fb8ff">
    <circle cx="40" cy="330" r="28" opacity="0.10"/>
    <circle cx="110" cy="360" r="18" opacity="0.08"/>
    <circle cx="540" cy="80" r="22" opacity="0.08"/>
    <circle cx="560" cy="340" r="30" opacity="0.07"/>
    <circle cx="300" cy="365" r="14" opacity="0.07"/>
  </g>

  <text x="64" y="94" letter-spacing="27"
        font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="400" fill="#ffffff">INSTITUTO</text>

  <g filter="url(#shadow)" stroke="#23272e" stroke-width="3" stroke-linejoin="round">
    <!-- N -->
    <path fill="url(#metal)" d="M60 320 V136 H112 L176 238 V212 H206 V320 H162 L108 234 V320 Z"/>
    <!-- T -->
    <path fill="url(#metal)" d="M218 136 H356 V174 H308 V320 H266 V174 H218 Z"/>
    <!-- A -->
    <path fill="url(#metal)" fill-rule="evenodd"
          d="M322 320 L398 136 H446 L528 320 H480 L464 280 H382 L366 320 Z M422 182 L447 244 H397 Z"/>
  </g>
  <g fill="url(#shine)">
    <path d="M60 320 V136 H112 L176 238 V212 H206 V320 H162 L108 234 V320 Z"/>
    <path d="M218 136 H356 V174 H308 V320 H266 V174 H218 Z"/>
    <path fill-rule="evenodd" d="M322 320 L398 136 H446 L528 320 H480 L464 280 H382 L366 320 Z M422 182 L447 244 H397 Z"/>
  </g>

  <!-- trilhas de circuito -->
  <g stroke="#e0262b" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="184" cy="140" r="6"/>
    <path d="M184 146 V172 L191 180 V210"/>
    <path d="M428 252 H540"/>
    <path d="M436 264 H540"/>
    <path d="M444 276 H540"/>
    <circle cx="546" cy="252" r="5"/>
    <circle cx="546" cy="264" r="5"/>
    <circle cx="546" cy="276" r="5"/>
  </g>
</svg>
