# ============================================================
#  CONFIGURAÇÃO DO ASSISTENTE: edite só este arquivo
#  Depois de salvar na branch main, o site se atualiza sozinho.
#
#  Dicas:
#   - Recue com 2 espaços (nunca TAB).
#   - Cores SEMPRE entre aspas: "#0F2540"
#   - Chaves de API NUNCA vão aqui: ficam nos secrets do Hugging Face.
# ============================================================

assistente:
  nome: "Professor de Dados & IA"
  descricao: "Tire suas dúvidas de Engenharia de Dados e Inteligência Artificial."

aparencia:                      # cores do Instituto NTA: azul, prata e vermelho
  cor_principal: "#132A5C"      # azul escuro: topo do degradê e mensagens do aluno
  cor_secundaria: "#27488F"     # azul: fim do degradê
  cor_destaque: "#E0262B"       # vermelho: botão Enviar, filete do topo e detalhes
  logo: "assets/logo.svg"       # a imagem precisa estar na pasta assets/
  logo_altura: 96               # em pixels (24 a 300)

ia:
  provedores:                   # ordem de preferência: o 1º é tentado primeiro
    - nome: openrouter
      modelo: "google/gemma-4-31b-it:free"
    - nome: anthropic
      modelo: "claude-haiku-4-5"
    - nome: openai
      modelo: "gpt-5-mini"
  max_tokens: 1024              # tamanho máximo da resposta (64 a 8192)
  temperatura: 0.5              # 0.0 = mais preciso, 1.0 = mais criativo
  tempo_limite_segundos: 30     # espera pela 1ª palavra antes de tentar o próximo
  max_caracteres_pergunta: 2000 # perguntas maiores são recusadas (protege seus créditos)
  max_mensagens_historico: 10   # quantas mensagens anteriores a IA "lembra"

comportamento:
  instrucoes: |
    Você é um professor paciente e didático de Engenharia de Dados e IA.
    Fala com alunos iniciantes e intermediários, sempre em português do Brasil.
    Explique com exemplos simples e, quando útil, passo a passo.
    Não responda assuntos fora de dados e IA; recuse com educação.
    Não invente fatos: se não souber, diga que não sabe.

exemplos:                       # até 6 perguntas; viram botões na tela
  - "O que é um pipeline de dados?"
  - "Qual a diferença entre data lake e data warehouse?"
  - "Como funciona um modelo de linguagem?"
  - "O que é ETL e ELT?"

base_conhecimento:              # Parte 2: o assistente consulta os documentos da pasta documentos/
  ativa: true                   # false = volta a responder só com o que o modelo sabe (Parte 1)
  modelo_embedding: "intfloat/multilingual-e5-small"   # o mesmo na indexação e na pergunta
  tamanho_trecho: 1500          # máximo de caracteres por trecho (300 a 3000; ~350 tokens)
  sobreposicao: 200             # caracteres repetidos ao subdividir seções longas (até metade do trecho)
  trechos_por_resposta: 4       # quantos trechos vão para o modelo (1 a 10; a apostila sugere 3 a 5)
  peso_palavras: 1.0            # peso da busca por palavras no RRF (0 desliga)
  peso_sentido: 1.0             # peso da busca por sentido no RRF (0 desliga)
  similaridade_minima: 0.80     # abaixo disso o trecho é descartado (provisório: calibrado na tarefa 5)
  mensagem_nao_encontrado: "Não encontrei isso no material do curso."
